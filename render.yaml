services:
  # Backend API Service
  - type: web
    name: workflowpp-backend
    env: node
    region: oregon
    plan: starter
    buildCommand: cd backend && npm ci --only=production
    startCommand: cd backend && node src/server.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        fromDatabase:
          name: workflowpp-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: workflowpp-redis
          type: redis
          property: connectionString
      - key: ANTHROPIC_API_KEY
        sync: false  # User must set this manually

  # Frontend Static Site
  - type: web
    name: workflowpp-frontend
    env: static
    region: oregon
    plan: starter
    buildCommand: cd ui && npm ci && npm run build
    staticPublishPath: ui/build
    pullRequestPreviewsEnabled: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /static/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    envVars:
      - key: REACT_APP_API_URL
        fromService:
          name: workflowpp-backend
          type: web
          property: hostport
          envVarKey: REACT_APP_API_URL
    autoDeploy: true

databases:
  # PostgreSQL Database
  - name: workflowpp-db
    databaseName: workflowpp
    user: workflowpp
    plan: starter  # $7/month, 256MB RAM, 1GB storage
    region: oregon
    postgresMajorVersion: 15

  # Redis Cache
  - name: workflowpp-redis
    plan: starter  # $10/month
    region: oregon
    maxmemoryPolicy: allkeys-lru
